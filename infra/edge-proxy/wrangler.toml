# Deploy: CLOUDFLARE_ACCOUNT_ID=7dc7167b7e2e00923bfa7cd697df14e4 npx wrangler deploy
# (the Cloudflare account that holds the podcasterium.com zone).
# Secret: UPSTREAM_ZONE (npx wrangler secret put UPSTREAM_ZONE).
name = "podcasterium-edge-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "api.podcasterium.com", custom_domain = true },
  { pattern = "mcp.podcasterium.com", custom_domain = true },
  { pattern = "search.podcasterium.com", custom_domain = true },
  { pattern = "cutter.podcasterium.com", custom_domain = true },
]
