# XcodeGen spec. Regenerate the Xcode project with `xcodegen generate`
# (run from this directory). The .xcodeproj is not committed.
name: Podcasterium
options:
  bundleIdPrefix: com.podcasterium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Podcasterium:
    type: application
    platform: iOS
    sources:
      - path: Podcasterium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podcasterium
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Podcasterium/Info.plist
      properties:
        CFBundleDisplayName: Podcasterium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  PodcasteriumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PodcasteriumTests
    dependencies:
      - target: Podcasterium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podcasterium.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Podcasterium:
    build:
      targets:
        Podcasterium: all
        PodcasteriumTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PodcasteriumTests
